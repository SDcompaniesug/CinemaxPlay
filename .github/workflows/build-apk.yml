name: Build APK
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Gradle cache
        run: |
          # Remove any stale gradle caches from previous runs
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper/dists
          rm -rf ~/.gradle/native
          rm -rf ~/.gradle/daemon

      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          set -e
          if [ -f project.zip ]; then
            mkdir -p  || true
            unzip -q project.zip -d  || exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Warm Gradle cache
        run: |
          # Pre-warm the gradle wrapper download
          cd  2>/dev/null || cd .
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon -q --version || true
          fi

      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e
          BUILD_DIR=.,
          cd $BUILD_DIR
          if [ -x ./gradlew ]; then
            GRADLE=./gradlew
          else
            GRADLE=gradle
          fi
          if [ "$BUILD_TYPE" = "release" ]; then
            $GRADLE clean assembleRelease --no-daemon --warning-mode all
          else
            $GRADLE clean assembleDebug --no-daemon --warning-mode all
          fi

      - name: Collect APK
        id: collect
        run: |
          set -e
          BUILD_DIR=.,
          cd $BUILD_DIR
          APK=""
          if [ "$BUILD_TYPE" = "release" ]; then
            APK=$(find . -name "*.apk" -path "*release*" | head -n 1)
            [ -z "$APK" ] && APK=$(find . -name "*.apk" | head -n 1)
          else
            APK=$(find . -name "*.apk" -path "*debug*" | head -n 1)
            [ -z "$APK" ] && APK=$(find . -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found" >&2
            exit 1
          fi
          echo "apk=$APK" >> $GITHUB_OUTPUT
          cp "$APK" ./build-output.apk
          echo "Artifact location: ./build-output.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-app-${{ inputs.build_type }}
          path: build-output.apk
          if-no-files-found: error