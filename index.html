<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CinemaxPlay</title><style>body{margin:0;background:#07090d;color:#f2f4f7;font:14px system-ui}header{padding:14px 18px;display:flex;gap:12px;position:sticky;top:0;background:#07090df5;z-index:2}.logo{font-weight:900;font-size:18px}.logo i{color:#39d353;font-style:normal}.search{flex:1;max-width:520px;background:#121720;border:1px solid #28303b;border-radius:10px;padding:9px}.search input{width:100%;background:none;border:0;outline:0;color:#fff}.content{padding:20px;max-width:1280px;margin:auto}.hero{height:55vh;min-height:380px;position:relative;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}.fade{position:absolute;inset:0;background:linear-gradient(90deg,#07090d,transparent),linear-gradient(0deg,#07090d,transparent)}.heroText{position:absolute;left:5vw;bottom:35px;max-width:560px}.heroText small{color:#39d353;font-weight:800}.heroText h1{font-size:clamp(30px,5vw,56px);margin:8px 0}.btn{border:0;border-radius:9px;padding:11px 16px;background:#39d353;font-weight:800}.cards{display:flex;gap:12px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:20px 12px}.card{width:112px;min-width:112px}.poster{height:158px;background:#151a21;border-radius:8px;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.card h3{font-size:12px;margin:7px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{font-size:9px;color:#778190;margin:0}.empty{text-align:center;padding:80px;color:#778190}nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#0a0d12f5;display:flex}nav button{flex:1;border:0;background:none;color:#778190}nav .active{color:#39d353}</style></head><body><div id="app"></div><script>const API='https://br-steep-leaf-b59uvinr-cinemaxsd.compute.c-7.us-east-2.aws.neon.tech',A=document.getElementById('app');let items=[],tab='home',q='';const title=x=>x.title||x.name||'Untitled',img=x=>x.poster||x.posterUrl||x.image||x.thumbnail||x.cover||x.backdrop||'',date=x=>x.uploadedAt||x.createdAt||x.created_at||x.uploadDate||x.publishedAt||0;const card=x=>`<div class="card"><div class="poster"><img src="${img(x)}"></div><h3>${title(x)}</h3><p>${x.year||''}</p></div>`;function home(){let h=items[0];return `${h?`<section class="hero"><img src="${img(h)}"><div class="fade"></div><div class="heroText"><small>FEATURED</small><h1>${title(h)}</h1><p>${h.description||''}</p><button class="btn">▶ Watch</button></div></section>`:''}<main class="content"><h2>New Releases</h2><div class="cards">${items.slice(0,12).map(card).join('')}</div><h2>All Content</h2><div class="grid">${items.map(card).join('')}</div></main>`}function list(){let a=items.filter(x=>title(x).toLowerCase().includes(q.toLowerCase()));return `<main class="content"><h2>${q?'Search':'All Content'}</h2><div class="grid">${a.map(card).join('')}</div></main>`}function render(){A.innerHTML=`<header><div class="logo">Cinemax<i>Play</i></div><div class="search">⌕ <input placeholder="Search movies & series" value="${q}" oninput="q=this.value;tab='list';render()"></div></header>${tab==='list'?list():home()}<nav><button class="${tab==='home'?'active':''}" onclick="tab='home';q='';render()">⌂<br>Home</button><button class="${tab==='list'?'active':''}" onclick="tab='list';render()">⌕<br>Search</button><button onclick="tab='list';q='';render()">▦<br>Categories</button><button>♡<br>My List</button></nav>`}async function load(){A.innerHTML='<div class="empty">Loading content…</div>';try{let r=await fetch(API),j=await r.json();items=(Array.isArray(j)?j:(j.items||j.data||j.results||j.movies||j.titles||j.content||j.catalog||[])).sort((a,b)=>new Date(date(b))-new Date(date(a)));render()}catch(e){A.innerHTML='<div class="empty">Unable to load content.<br>'+e.message+'</div>'}}load()</script></body></html>
